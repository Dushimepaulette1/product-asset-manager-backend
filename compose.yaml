name: product-asset-manager

x-servicebus-connection: &servicebus-connection "Endpoint=sb://servicebus;SharedAccessKeyName=RootManageSharedAccessKey;SharedAccessKey=SAS_KEY_VALUE;UseDevelopmentEmulator=true;"

x-sqlserver: &sqlserver
  image: mcr.microsoft.com/mssql/server:2022-CU27-ubuntu-22.04
  restart: unless-stopped
  environment:
    ACCEPT_EULA: "Y"
    MSSQL_SA_PASSWORD: ${SQL_SA_PASSWORD:?Set SQL_SA_PASSWORD in .env}
    MSSQL_MEMORY_LIMIT_MB: "1536"
  healthcheck:
    test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q \"SELECT 1\" -b -o /dev/null"]
    interval: 10s
    timeout: 5s
    retries: 10
    start_period: 20s

x-app: &app
  image: product-asset-manager:local
  pull_policy: never
  restart: unless-stopped
  environment: &app-environment
    ASPNETCORE_ENVIRONMENT: Production
    ConnectionStrings__DefaultConnection: "Server=sqlserver,1433;Database=ProductAssetManagerDb;User Id=sa;Password=${SQL_SA_PASSWORD:?Set SQL_SA_PASSWORD in .env};TrustServerCertificate=True;MultipleActiveResultSets=true"
    ServiceBus__ConnectionString: *servicebus-connection
    ServiceBus__QueueName: orders
    ServiceBus__StockEventsConnectionString: *servicebus-connection
    ServiceBus__StockEventsQueueName: stock-events
    Jwt__SigningKey: ${JWT_SIGNING_KEY:?Set JWT_SIGNING_KEY in .env}
    SeedAdmin__Email: ${SEED_ADMIN_EMAIL:?Set SEED_ADMIN_EMAIL in .env}
    SeedAdmin__Password: ${SEED_ADMIN_PASSWORD:?Set SEED_ADMIN_PASSWORD in .env}
    Database__InitializeOnStartup: "false"
    OpenTelemetry__DeploymentEnvironment: ${DEPLOYMENT_ENVIRONMENT:-local}
    OpenTelemetry__TraceSamplingRatio: ${TRACE_SAMPLING_RATIO:-1.0}
    OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
    OTEL_METRIC_EXPORT_INTERVAL: "10000"

x-app-dependencies: &app-dependencies
  migrator:
    condition: service_completed_successfully
  servicebus-ready:
    condition: service_completed_successfully

services:
  sqlserver:
    <<: *sqlserver
    ports:
      - "${SQL_PORT:-14333}:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql

  servicebus-sql:
    <<: *sqlserver

  servicebus:
    image: mcr.microsoft.com/azure-messaging/servicebus-emulator:2.0.1
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      SQL_SERVER: servicebus-sql
      MSSQL_SA_PASSWORD: ${SQL_SA_PASSWORD:?Set SQL_SA_PASSWORD in .env}
    volumes:
      - ./docker/servicebus/Config.json:/ServiceBus_Emulator/ConfigFiles/Config.json:ro
    ports:
      - "${SERVICEBUS_PORT:-5672}:5672"
      - "${SERVICEBUS_MANAGEMENT_PORT:-5300}:5300"
    depends_on:
      servicebus-sql:
        condition: service_healthy

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.162.0
    restart: unless-stopped
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    volumes:
      - ./docker/otel-collector/config.yaml:/etc/otelcol-contrib/config.yaml:ro
    ports:
      - "${OTLP_GRPC_PORT:-4317}:4317"
      - "${OTLP_HTTP_PORT:-4318}:4318"
    depends_on:
      tempo:
        condition: service_started
      loki:
        condition: service_started
      prometheus:
        condition: service_started

  tempo:
    image: grafana/tempo:2.9.0
    restart: unless-stopped
    command: ["-config.file=/etc/tempo/tempo.yaml"]
    volumes:
      - ./docker/tempo/tempo.yaml:/etc/tempo/tempo.yaml:ro
    ports:
      - "${TEMPO_PORT:-3200}:3200"

  loki:
    image: grafana/loki:3.6.18
    restart: unless-stopped
    command: ["-config.file=/etc/loki/loki.yaml"]
    volumes:
      - ./docker/loki/loki.yaml:/etc/loki/loki.yaml:ro
    ports:
      - "${LOKI_PORT:-3100}:3100"

  prometheus:
    image: prom/prometheus:v3.15.0
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --web.enable-otlp-receiver
      - --storage.tsdb.retention.time=7d
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"

  grafana:
    image: grafana/grafana:13.2.4
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:?Set GRAFANA_ADMIN_USER in .env}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD in .env}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./docker/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    depends_on:
      tempo:
        condition: service_started
      loki:
        condition: service_started
      prometheus:
        condition: service_started

  servicebus-ready:
    image: curlimages/curl:8.11.1
    command:
      - sh
      - -c
      - until curl --silent --fail http://servicebus:5300/health | grep -q healthy; do echo waiting for the Service Bus emulator; sleep 3; done
    depends_on:
      servicebus:
        condition: service_started

  migrator:
    <<: *app
    build:
      context: .
      args:
        APP_VERSION: ${APP_VERSION:-local}
        GIT_SHA: ${GIT_SHA:-local}
    pull_policy: build
    restart: "no"
    command: ["--migrate"]
    environment:
      <<: *app-environment
      OTEL_SERVICE_NAME: database-migrator
      Seed__DemoData: "true"
    healthcheck:
      disable: true
    depends_on:
      sqlserver:
        condition: service_healthy

  api:
    <<: *app
    environment:
      <<: *app-environment
      OTEL_SERVICE_NAME: inventory-api
      Api__Enabled: "true"
      Consumer__Enabled: "false"
      Swagger__Enabled: "true"
    ports:
      - "${API_PORT:-8080}:8080"
    depends_on: *app-dependencies

  consumer:
    <<: *app
    environment:
      <<: *app-environment
      OTEL_SERVICE_NAME: order-consumer
      Api__Enabled: "false"
      Consumer__Enabled: "true"
    depends_on: *app-dependencies

volumes:
  sqlserver-data:
  prometheus-data:
