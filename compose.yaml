name: product-asset-manager

x-app: &app
  image: product-asset-manager:local
  pull_policy: never
  restart: unless-stopped
  environment: &app-environment
    ASPNETCORE_ENVIRONMENT: Production
    ConnectionStrings__DefaultConnection: "Server=sqlserver,1433;Database=ProductAssetManagerDb;User Id=sa;Password=${SQL_SA_PASSWORD:?Set SQL_SA_PASSWORD in .env};TrustServerCertificate=True;MultipleActiveResultSets=true"
    ServiceBus__ConnectionString: "Endpoint=sb://servicebus;SharedAccessKeyName=RootManageSharedAccessKey;SharedAccessKey=SAS_KEY_VALUE;UseDevelopmentEmulator=true;"
    ServiceBus__QueueName: orders
    ServiceBus__StockEventsConnectionString: "Endpoint=sb://servicebus;SharedAccessKeyName=RootManageSharedAccessKey;SharedAccessKey=SAS_KEY_VALUE;UseDevelopmentEmulator=true;"
    ServiceBus__StockEventsQueueName: stock-events
    Jwt__SigningKey: ${JWT_SIGNING_KEY:?Set JWT_SIGNING_KEY in .env}
    SeedAdmin__Email: ${SEED_ADMIN_EMAIL:?Set SEED_ADMIN_EMAIL in .env}
    SeedAdmin__Password: ${SEED_ADMIN_PASSWORD:?Set SEED_ADMIN_PASSWORD in .env}
    Database__InitializeOnStartup: "false"

x-app-dependencies: &app-dependencies
  migrator:
    condition: service_completed_successfully
  servicebus-ready:
    condition: service_completed_successfully

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-CU27-ubuntu-22.04
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${SQL_SA_PASSWORD:?Set SQL_SA_PASSWORD in .env}
    ports:
      - "${SQL_PORT:-14333}:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q \"SELECT 1\" -b -o /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  servicebus-sql:
    image: mcr.microsoft.com/mssql/server:2022-CU27-ubuntu-22.04
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${SQL_SA_PASSWORD:?Set SQL_SA_PASSWORD in .env}
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q \"SELECT 1\" -b -o /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  servicebus:
    image: mcr.microsoft.com/azure-messaging/servicebus-emulator:2.0.1
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      SQL_SERVER: servicebus-sql
      MSSQL_SA_PASSWORD: ${SQL_SA_PASSWORD:?Set SQL_SA_PASSWORD in .env}
    volumes:
      - ./docker/servicebus/Config.json:/ServiceBus_Emulator/ConfigFiles/Config.json:ro
    ports:
      - "${SERVICEBUS_PORT:-5672}:5672"
      - "${SERVICEBUS_MANAGEMENT_PORT:-5300}:5300"
    depends_on:
      servicebus-sql:
        condition: service_healthy

  servicebus-ready:
    image: curlimages/curl:8.11.1
    command:
      - sh
      - -c
      - until curl --silent --fail http://servicebus:5300/health | grep -q healthy; do echo waiting for the Service Bus emulator; sleep 3; done
    depends_on:
      servicebus:
        condition: service_started

  migrator:
    <<: *app
    build: .
    pull_policy: build
    restart: "no"
    command: ["--migrate"]
    environment:
      <<: *app-environment
      Seed__DemoData: "true"
    healthcheck:
      disable: true
    depends_on:
      sqlserver:
        condition: service_healthy

  api:
    <<: *app
    environment:
      <<: *app-environment
      Api__Enabled: "true"
      Consumer__Enabled: "false"
      Swagger__Enabled: "true"
    ports:
      - "${API_PORT:-8080}:8080"
    depends_on: *app-dependencies

  consumer:
    <<: *app
    environment:
      <<: *app-environment
      Api__Enabled: "false"
      Consumer__Enabled: "true"
    depends_on: *app-dependencies

volumes:
  sqlserver-data:
